[package]
name = "tackle"
version = "0.1.0"
edition = "2021"
description = "An unsafe Windows desktop harness for a fleet of Claude Code sessions with hand-managed context"
license = "MIT"
readme = "README.md"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
vt100 = "0.15"
tray-icon = "0.19"
raw-window-handle = "0.6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_Shell"] }

[profile.release]
opt-level = 2

[build-dependencies]
winresource = "0.1"
